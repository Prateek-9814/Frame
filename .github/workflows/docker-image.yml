    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    # Manual Approval step for Main branch
    - name: Manual Approval for Production Deployment
      uses: trstringer/manual-approval@v1
      if: github.ref == 'refs/heads/main'
      with:
        secret: ${{ github.TOKEN }}
        approvers: Prateek-9814
        minimum-approvals: 1
        issue-title: "Deploying to prod from staging"
        issue-body: "Please approve or deny the deployment"
        exclude-workflow-initiator-as-approver: false
        additional-approved-words: ''
        additional-denied-words: ''

    - name: Merge Staging to Main
      if: github.ref == 'refs/heads/staging'
      uses: "peter-evans/pull-request@v4"
      with:
        commit-message: "Merging Staging into Main after successful approval"
        branch: "main"
        delete-branch: false
